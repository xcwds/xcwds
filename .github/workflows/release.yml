# Publishes the @xcwds packages to npm with changesets, once CI has passed on main.
#
# Each run either opens (or updates) a "Version packages" PR that turns the pending changesets
# into versions and changelogs, or, after that PR is merged, publishes every package whose
# version isn't on npm yet. Packages marked "private": true are never published.
#
# Off until the npm side is set up (see .changeset/README.md): set the repository variable
# NPM_RELEASE to true, and either add an NPM_TOKEN secret or register this workflow as the
# packages' trusted publisher on npmjs.com.
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  # Never cut a publish short; the next run waits.
  cancel-in-progress: false

jobs:
  release:
    # A CI run on main triggers a release only while its commit is still main's head. changesets/action
    # resets its branch to github.sha (main's head when this run was created), which a shallow checkout
    # of an older commit doesn't contain; the newer commit's own CI run triggers the release instead.
    if: >-
      vars.NPM_RELEASE == 'true' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_sha == github.sha))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Required reviewers on this environment gate every run: version PR updates and publishes.
    environment: npm
    # Job permissions replace the workflow's.
    permissions:
      # Push the changeset-release/main branch and the release tags (through the GitHub API).
      contents: write
      # Open the "Version packages" PR.
      pull-requests: write
      # Trusted publishing and npm provenance.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit CI tested (the job only runs when it is github.sha).
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          # No `cache: pnpm`: this job publishes, so it installs from the registry rather than restore a
          # store another run on main (like the agent workflows) could have saved.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # changesets/action v2 no longer writes an .npmrc from NPM_TOKEN, so this does what v1 did: put
      # the token in ~/.npmrc, where `pnpm publish` reads auth from. `npm whoami` then flags a token
      # that has expired (granular tokens last 7 days by default; #208 only saw a 404 on every PUT)
      # without failing runs that only update the Version packages PR. Skipped when the secret is
      # empty, for trusted publishing.
      - name: Set up npm auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" >> ~/.npmrc
            npm whoami || echo "::warning::NPM_TOKEN was refused by npm (expired?); a publish would fail with 404s."
          fi

      - name: Open the version PR, or publish to npm
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          pr-title: Version packages
          commit-message: Version packages
        env:
          NPM_CONFIG_PROVENANCE: true
