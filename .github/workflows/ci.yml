name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: CI never writes to the repository.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ci-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Type check
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Check package exports
        run: pnpm publint

      - name: Unit tests
        run: pnpm test:unit --run

      - name: Install Playwright's Chromium
        run: pnpm --filter @xcwds/example-minimal exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Generate an app with npm create @xcwds and run its tests
        run: pnpm test:starter

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            examples/*/playwright-report/
            examples/*/test-results/
            site/playwright-report/
            site/test-results/
          retention-days: 7

  # The oldest Node the packages' `engines` allow (>=22.18): the checks job runs .tool-versions.
  node-22:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ci-node-22-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node.js 22.18
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Keep in step with `engines.node` in every package.json.
          node-version: 22.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Unit tests
        run: pnpm test:unit --run

      - name: Install Playwright's Chromium
        run: pnpm --filter @xcwds/example-minimal exec playwright install --with-deps chromium

      - name: Generate an app with npm create @xcwds and run its tests
        run: pnpm test:starter
