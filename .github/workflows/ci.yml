name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ci-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Type check
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Check package exports
        run: pnpm publint

      - name: Unit tests
        run: pnpm test:unit --run

      - name: Install Playwright's Chromium
        run: pnpm --filter @xcwds/example-minimal exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Generate an app with npm create @xcwds and run its tests
        run: pnpm test:starter

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            examples/*/playwright-report/
            examples/*/test-results/
            site/playwright-report/
            site/test-results/
          retention-days: 7
